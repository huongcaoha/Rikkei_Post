name: CI/CD Pipeline - Rikkei Post Logistics

on:
  push:
    branches:
      - main # Kích hoạt pipeline khi có code đẩy lên nhánh main

jobs:
  # 1. Build & Push Backend song song (sử dụng cache GitHub Actions giúp build cực nhanh)
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || 'huongcaoha' }}/rkp-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Build & Push Frontend song song
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || 'huongcaoha' }}/rkp-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Tự động cập nhật file docker-compose.yml và kích hoạt deploy trên VPS
  deploy-to-vps:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare docker-compose.yml
        run: |
          echo "COMPOSE_B64=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: COMPOSE_B64
          script: |
            set -e
            mkdir -p /root/rkp_project
            cd /root/rkp_project

            # Cập nhật ngay lập tức file docker-compose.yml từ Git qua SSH
            echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

            # 0. Tự động đồng bộ thời gian chuẩn (NTP) cho VPS
            echo "==> Tự động đồng bộ đồng hồ hệ thống VPS..."
            timedatectl set-timezone Asia/Ho_Chi_Minh 2>/dev/null || true
            timedatectl set-ntp true 2>/dev/null || true
            if ! command -v chronyd >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq chrony 2>/dev/null || true
            fi
            systemctl restart chrony 2>/dev/null || true

            # 1. Đảm bảo hạ tầng Database & Message Broker chạy trước
            echo "==> Khởi động hạ tầng nền tảng (Postgres, Kafka, Redis, MinIO)..."
            docker compose up -d postgres kafka redis minio

            # 2. Kéo image tuần tự với cơ chế retry tự động
            echo "==> Kéo image mới nhất từ Docker Hub..."
            pull_with_retry() {
              local img=$1
              for i in 1 2 3; do
                echo "Đang kéo $img (lần thử $i)..."
                if docker pull "$img"; then
                  echo "Kéo $img thành công!"
                  return 0
                else
                  echo "Lần $i thất bại cho $img, thử lại sau 3 giây..."
                  sleep 3
                fi
              done
              echo "Không thể kéo $img sau 3 lần thử!"
              return 1
            }

            DOCKER_USER="${{ secrets.DOCKER_USERNAME || 'huongcaoha' }}"
            pull_with_retry "$DOCKER_USER/rkp-backend:latest"
            pull_with_retry "$DOCKER_USER/rkp-frontend:latest"

            # 3. Tái khởi động Backend & Frontend với container và code mới nhất
            echo "==> Cập nhật và chạy lại Backend & Frontend..."
            docker compose up -d --no-deps --force-recreate backend frontend

            # 4. Dọn dẹp các images rác/cũ để giải phóng dung lượng ổ cứng VPS
            echo "==> Dọn dẹp images cũ..."
            docker image prune -f

            echo "==> Triển khai Rikkei Post Logistics thành công!"
