services:
  # =========================================================================
  # 1. DATABASE TIER (PostgreSQL 15)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: rkp-postgres
    restart: always
    environment:
      POSTGRES_USER: rkp_admin
      POSTGRES_PASSWORD: rkp_password_2026
      POSTGRES_DB: rkp_logistics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./documents/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - rkp-network

  # =========================================================================
  # 2. CACHE & DISTRIBUTED LOCK TIER (Redis)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: rkp-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "rkp_redis_2026"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rkp-network

  # =========================================================================
  # 3. MESSAGE BROKER: APACHE KAFKA (KRAFT MODE - NO ZOOKEEPER)
  # =========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: rkp-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - rkp-network

  # Kafka UI for real-time topic monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rkp-kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-rikkei-post
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - rkp-network

  # =========================================================================
  # 4. OBJECT STORAGE TIER (MinIO S3 Compatible for POD photos & documents)
  # =========================================================================
  minio:
    image: minio/minio:latest
    container_name: rkp-minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rkp_minio_admin
      MINIO_ROOT_PASSWORD: rkp_minio_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - rkp-network

  # =========================================================================
  # 5. MOCK SMTP & EMAIL TESTING TIER (MailHog)
  # =========================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: rkp-mailhog
    restart: always
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - rkp-network

  # =========================================================================
  # 6. BACKEND SERVICE (Spring Boot Application)
  # =========================================================================
  backend:
    image: ${DOCKER_USERNAME:-huongcaoha}/rkp-backend:latest
    container_name: rkp-backend
    restart: always
    mem_limit: 650m
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -Xmx512M -Xms256M -Xss2M -XX:+UseG1GC
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rkp_logistics}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-rkp_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-rkp_password_2026}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-rkp_redis_2026}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - APP_JWT_SECRET=${APP_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-huongcaoha1994@gmail.com}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID}
      - PAYOS_API_KEY=${PAYOS_API_KEY}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL_PREFIX=${R2_PUBLIC_URL_PREFIX}
    networks:
      - rkp-network

  # =========================================================================
  # 7. FRONTEND SERVICE (Nginx Production Server)
  # =========================================================================
  frontend:
    image: ${DOCKER_USERNAME:-huongcaoha}/rkp-frontend:latest
    container_name: rkp-frontend
    restart: always
    mem_limit: 100m
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rkp-network

networks:
  rkp-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local
